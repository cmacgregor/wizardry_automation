# Pre-built image:  docker compose pull && docker compose up -d
# Build locally:    docker compose up -d --build
services:
  wizardry-bot:
    image: ghcr.io/cmacgregor/wizardry_automation:latest
    build: .
    container_name: wizardry-automation
    restart: unless-stopped

    # Forward stop signals to the script (Python as PID 1 ignores SIGTERM)
    init: true

    env_file:
      - .env

    # Security: no capabilities, no privilege escalation, read-only filesystem
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true

    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M

    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"
